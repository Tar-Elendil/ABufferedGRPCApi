syntax = "proto3";

import "google/protobuf/timestamp.proto";

service Account {
  rpc Balance (BalanceRequest) returns (BalanceResponse);
  rpc Statement (StatementExportRequest) returns (stream StatementExport);
}

message BalanceRequest {
    string account_id = 1;
}

message BalanceResponse {
    double balance = 1;
}

message StatementExportRequest {
    string account_id = 1;
    uint32 index = 2;
    google.protobuf.Timestamp start = 3;
    google.protobuf.Timestamp end = 4;
}

message StatementExport {
    bytes chunk = 1;
    int64 size = 2;
    uint32 index = 3;
    bool is_done = 4;
}